<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloch-gömb Szimulátor</title>
<style>
  :root {
    --bg-dark: #0b0f19;
    --bg-panel: #151c2c;
    --bg-card: #1e293b;
    --accent: #667eea;
    --accent-hover: #764ba2;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
    --danger: #ef4444;
    --success: #22c55e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    background-color: var(--bg-panel);
    padding: 15px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
  }

  header h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

  .main-container {
    display: grid;
    grid-template-columns: 320px 1fr 380px;
    flex: 1;
    overflow: hidden;
  }

  .panel {
    background-color: var(--bg-panel);
    border-right: 1px solid var(--border);
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .panel-right {
    border-right: none;
    border-left: 1px solid var(--border);
  }

  .card {
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 15px;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 15px;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 8px;
  }

  label {
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--text-muted);
    display: block;
    margin-bottom: 5px;
  }

  input[type="number"] {
    background: #0f172a;
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 8px 10px;
    border-radius: 5px;
    font-size: 0.9rem;
    width: 100%;
    margin-bottom: 10px;
  }

  .btn {
    background-color: var(--accent);
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    width: 100%;
  }

  .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
  .btn-danger { background-color: var(--danger); }
  .btn-danger:hover { background-color: #dc2626; }
  .btn-success { background-color: var(--success); }
  .btn-success:hover { background-color: #16a34a; }
  .btn-sm { padding: 6px 12px; width: auto; font-size: 0.8rem; }

  .state-list { display: flex; flex-direction: column; gap: 8px; }
  .state-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 6px;
  }
  .state-info strong { color: var(--accent); display: block; margin-bottom: 3px; font-size: 0.9rem; }
  .state-info span { font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }

  .gate-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
  }

  .gate-btn {
    background: #0f172a;
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 12px 5px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.15s;
    text-align: center;
  }
  .gate-btn:hover {
    border-color: var(--accent);
    background: rgba(102, 126, 234, 0.2);
    transform: translateY(-2px);
  }

  .rotation-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
  }
  .rotation-row label { margin-bottom: 0; width: 45px; }
  .rotation-row input { margin-bottom: 0; flex: 1; }

  .circuit-track {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 6px;
    min-height: 60px;
    margin-bottom: 15px;
    align-items: center;
  }

  .circuit-node {
    background: var(--accent);
    color: white;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 0.85rem;
    font-weight: 700;
  }
  .circuit-node.rotation { background: var(--success); }

  .actions-row { display: flex; gap: 10px; }

  .canvas-area {
    position: relative;
    background: radial-gradient(circle at center, #111827 0%, #070a12 100%);
    min-height: 400px;
    min-width: 300px;
    overflow: hidden;
  }
  
  #blochCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  
  #blochCanvas:active { cursor: grabbing; }

  .canvas-overlay-top {
    position: absolute;
    top: 15px;
    left: 15px;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(4px);
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 8px;
    font-size: 0.8rem;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>

<header>
  <h1>Bloch-gömb Szimulátor</h1>
</header>

<div class="main-container">
  
  <div class="panel">
    <div class="card">
      <div class="card-title">Kezdőállapot</div>
      <label>θ (theta) - poláris szög (0 - π):</label>
      <input type="number" id="theta" value="0" min="0" max="3.14159" step="0.01">
      <label>φ (phi) - azimutális szög (0 - 2π):</label>
      <input type="number" id="phi" value="0" min="0" max="6.28318" step="0.01">
      <button class="btn btn-success" onclick="setInitialState()">Állapot beállítása</button>
    </div>

    <div class="card" style="flex:1;">
      <div class="card-title">Állapotok</div>
      <div id="statesList" class="state-list"></div>
    </div>
  </div>

  <div class="canvas-area" id="canvasContainer">
    <div class="canvas-overlay-top">
      <strong>3D kamera vezérlés:</strong><br>
      <span style="color:var(--text-muted);">Bal egérgomb + húzás = Forgatás | Görgő = Nagyítás</span>
    </div>
    <canvas id="blochCanvas"></canvas>
  </div>

  <div class="panel panel-right">
    <div class="card">
      <div class="card-title">Alapkapuk</div>
      <div class="gate-grid">
        <button class="gate-btn" onclick="addGate('X')">X</button>
        <button class="gate-btn" onclick="addGate('Y')">Y</button>
        <button class="gate-btn" onclick="addGate('Z')">Z</button>
        <button class="gate-btn" onclick="addGate('H')">H</button>
        <button class="gate-btn" onclick="addGate('S')">S</button>
        <button class="gate-btn" onclick="addGate('T')">T</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Forgatási kapuk</div>
      <div class="rotation-row">
        <label>Rx(θ):</label>
        <input type="number" id="rxAngle" value="0" min="0" max="6.28318" step="0.01">
        <button class="btn btn-sm" onclick="addRotationGate('Rx', 'rxAngle')">Hozzáad</button>
      </div>
      <div class="rotation-row">
        <label>Ry(θ):</label>
        <input type="number" id="ryAngle" value="0" min="0" max="6.28318" step="0.01">
        <button class="btn btn-sm" onclick="addRotationGate('Ry', 'ryAngle')">Hozzáad</button>
      </div>
      <div class="rotation-row">
        <label>Rz(θ):</label>
        <input type="number" id="rzAngle" value="0" min="0" max="6.28318" step="0.01">
        <button class="btn btn-sm" onclick="addRotationGate('Rz', 'rzAngle')">Hozzáad</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Kapu sorozat</div>
      <div class="circuit-track" id="gateSequence">
        <span style="color:var(--text-muted); font-size:0.8rem;">Üres áramkör...</span>
      </div>
      <div class="actions-row">
        <button class="btn" style="flex:2;" onclick="applyGates()">Kapuk alkalmazása</button>
        <button class="btn btn-danger" style="flex:1;" onclick="clearGates()">Törlés</button>
      </div>
    </div>
  </div>

</div>

<script>

class Complex {
  constructor(re = 0, im = 0) { this.re = re; this.im = im; }
  add(c) { return new Complex(this.re + c.re, this.im + c.im); }
  mul(c) { return new Complex(this.re * c.re - this.im * c.im, this.re * c.im + this.im * c.re); }
  scale(s) { return new Complex(this.re * s, this.im * s); }
  conj() { return new Complex(this.re, -this.im); }
  absSq() { return this.re * this.re + this.im * this.im; }
}

const SQRT1_2 = 1 / Math.sqrt(2);
const GATES = {
  'X': [[new Complex(0,0), new Complex(1,0)], [new Complex(1,0), new Complex(0,0)]],
  'Y': [[new Complex(0,0), new Complex(0,-1)], [new Complex(0,1), new Complex(0,0)]],
  'Z': [[new Complex(1,0), new Complex(0,0)], [new Complex(0,0), new Complex(-1,0)]],
  'H': [[new Complex(SQRT1_2,0), new Complex(SQRT1_2,0)], [new Complex(SQRT1_2,0), new Complex(-SQRT1_2,0)]],
  'S': [[new Complex(1,0), new Complex(0,0)], [new Complex(0,0), new Complex(0,1)]],
  'T': [[new Complex(1,0), new Complex(0,0)], [new Complex(0,0), new Complex(SQRT1_2, SQRT1_2)]]
};

function getRotationGate(axis, angleRad) {
  const half = angleRad / 2;
  const c = Math.cos(half);
  const s = Math.sin(half);
  if (axis === 'Rx') return [[new Complex(c, 0), new Complex(0, -s)], [new Complex(0, -s), new Complex(c, 0)]];
  if (axis === 'Ry') return [[new Complex(c, 0), new Complex(-s, 0)], [new Complex(s, 0), new Complex(c, 0)]];
  if (axis === 'Rz') return [[new Complex(c, -s), new Complex(0, 0)], [new Complex(0, 0), new Complex(c, s)]];
}

const COLORS = ['#ef4444', '#22c55e', '#3b82f6', '#eab308', '#d946ef', '#06b6d4'];
let states = [];
let gateSequence = [];
let stateCounter = 0;

function anglesToState(thetaRad, phiRad) {
  const alpha = new Complex(Math.cos(thetaRad / 2), 0);
  const sinHalf = Math.sin(thetaRad / 2);
  const beta = new Complex(sinHalf * Math.cos(phiRad), sinHalf * Math.sin(phiRad));
  return [alpha, beta];
}

function stateToAngles(alpha, beta) {
  const norm = Math.sqrt(alpha.absSq() + beta.absSq());
  const a = norm > 0 ? alpha.scale(1/norm) : new Complex(1,0);
  const b = norm > 0 ? beta.scale(1/norm) : new Complex(0,0);
  const z = Math.max(-1, Math.min(1, a.absSq() - b.absSq()));
  const theta = Math.acos(z);
  
  const ab = a.conj().mul(b);
  let phi = Math.atan2(ab.im, ab.re);
  if (phi < 0) phi += 2 * Math.PI;
  return { theta, phi };
}

function addState(theta, phi, name) {
  const color = COLORS[stateCounter % COLORS.length];
  const [alpha, beta] = anglesToState(theta, phi);
  
  const x = Math.sin(theta) * Math.cos(phi);
  const y = Math.sin(theta) * Math.sin(phi);
  const z = Math.cos(theta);

  states.push({ id: stateCounter++, name, theta, phi, color, alpha, beta, x, y, z });
  updateStatesList();
}

function removeState(id) {
  states = states.filter(s => s.id !== id);
  updateStatesList();
}

function setInitialState() {
  const theta = parseFloat(document.getElementById('theta').value) || 0;
  const phi = parseFloat(document.getElementById('phi').value) || 0;
  addState(theta, phi, `|ψ${stateCounter}⟩`);
}

function updateStatesList() {
  const list = document.getElementById('statesList');
  if (!list) return;
  list.innerHTML = '';
  states.forEach(st => {
    list.innerHTML += `
      <div class="state-item">
        <div class="state-info">
          <strong style="color:${st.color}">${st.name}</strong>
          <span>θ=${st.theta.toFixed(3)}, φ=${st.phi.toFixed(3)}</span>
        </div>
        <button class="btn btn-danger btn-sm" onclick="removeState(${st.id})">Törlés</button>
      </div>`;
  });
}

function addGate(name) {
  gateSequence.push({ type: 'gate', name });
  updateGateSequence();
}

function addRotationGate(name, inputId) {
  const angle = parseFloat(document.getElementById(inputId).value) || 0;
  gateSequence.push({ type: 'rotation', name, angle });
  updateGateSequence();
}

function updateGateSequence() {
  const container = document.getElementById('gateSequence');
  if (!container) return;
  if (gateSequence.length === 0) {
    container.innerHTML = '<span style="color:var(--text-muted); font-size:0.8rem;">Üres áramkör...</span>';
    return;
  }
  container.innerHTML = '';
  gateSequence.forEach(g => {
    const text = g.type === 'rotation' ? `${g.name}(${g.angle.toFixed(2)})` : g.name;
    const cls = g.type === 'rotation' ? 'circuit-node rotation' : 'circuit-node';
    container.innerHTML += `<div class="${cls}">${text}</div>`;
  });
}

function clearGates() {
  gateSequence = [];
  updateGateSequence();
}

function applyGates() {
  if (gateSequence.length === 0 || states.length === 0) return;
  
  const lastState = states[states.length - 1];
  let currentAlpha = lastState.alpha;
  let currentBeta = lastState.beta;

  gateSequence.forEach(gate => {
    const mat = gate.type === 'rotation' ? getRotationGate(gate.name, gate.angle) : GATES[gate.name];
    const newA = mat[0][0].mul(currentAlpha).add(mat[0][1].mul(currentBeta));
    const newB = mat[1][0].mul(currentAlpha).add(mat[1][1].mul(currentBeta));
    currentAlpha = newA;
    currentBeta = newB;
  });

  const angles = stateToAngles(currentAlpha, currentBeta);
  const gateNames = gateSequence.map(g => g.type === 'rotation' ? `${g.name}(${g.angle.toFixed(2)})` : g.name).join('·');
  
  addState(angles.theta, angles.phi, `|ψ${stateCounter}⟩ = ${gateNames}`);
}

let canvas, ctx;
let camYaw = -0.785, camPitch = 0.5, camZoom = 1.0; 
let isDragging = false, lastX = 0, lastY = 0;

function resize() {
  const container = document.getElementById('canvasContainer');
  if (canvas && container) {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
  }
}

function project(bx, by, bz, radius, cx, cy) {
  const cosY = Math.cos(camYaw), sinY = Math.sin(camYaw);
  const x1 = bx * cosY - bz * sinY;
  const z1 = bx * sinY + bz * cosY;
  
  const cosP = Math.cos(camPitch), sinP = Math.sin(camPitch);
  const y2 = by * cosP - z1 * sinP;
  
  return { x: cx + x1 * radius, y: cy - y2 * radius };
}

function drawArrow(x1, y1, x2, y2, color) {
  const headLen = 10, angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI/6), y2 - headLen * Math.sin(angle - Math.PI/6));
  ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI/6), y2 - headLen * Math.sin(angle + Math.PI/6));
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}

function drawRender() {
  if (!canvas || !ctx) return;
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const radius = Math.min(cx, cy) * 0.65 * camZoom;

  if (radius <= 0) {
    requestAnimationFrame(drawRender);
    return;
  }

  const grad = ctx.createRadialGradient(cx - radius*0.2, cy - radius*0.2, radius*0.1, cx, cy, radius);
  grad.addColorStop(0, 'rgba(30, 41, 59, 0.4)');
  grad.addColorStop(1, 'rgba(15, 23, 42, 0.8)');
  ctx.beginPath(); ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
  ctx.fillStyle = grad; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)'; ctx.stroke();

  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const t = (i / 60) * 2 * Math.PI;
    const p = project(Math.cos(t), 0, Math.sin(t), radius, cx, cy);
    if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)'; ctx.stroke();
  
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const t = (i / 60) * 2 * Math.PI;
    const p = project(Math.cos(t), Math.sin(t), 0, radius, cx, cy);
    if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.15)'; ctx.stroke();

  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const t = (i / 60) * 2 * Math.PI;
    const p = project(0, Math.cos(t), Math.sin(t), radius, cx, cy);
    if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();

  const axes = [
    { from: [-1,0,0], to: [1,0,0], col: '#ef4444', posLbl: '|+⟩', negLbl: '|-⟩' },
    { from: [0,-1,0], to: [0,1,0], col: '#22c55e', posLbl: '|+i⟩', negLbl: '|-i⟩' }, // Y-tengely
    { from: [0,0,-1], to: [0,0,1], col: '#38bdf8', posLbl: '|0⟩', negLbl: '|1⟩' }    // Z-tengely
  ];

  axes.forEach(ax => {
    const p1 = project(ax.from[0], ax.from[1], ax.from[2], radius, cx, cy);
    const p2 = project(ax.to[0], ax.to[1], ax.to[2], radius, cx, cy);
    
    ctx.strokeStyle = ax.col; ctx.globalAlpha = 0.6; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    ctx.globalAlpha = 1.0;
    
    const ptPos = project(ax.to[0]*1.15, ax.to[1]*1.15, ax.to[2]*1.15, radius, cx, cy);
    ctx.fillStyle = ax.col; ctx.font = 'bold 13px Segoe UI';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ax.posLbl, ptPos.x, ptPos.y);

    const ptNeg = project(ax.from[0]*1.15, ax.from[1]*1.15, ax.from[2]*1.15, radius, cx, cy);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; 
    ctx.fillText(ax.negLbl, ptNeg.x, ptNeg.y);
  });

  states.forEach(st => {
    const pt = project(st.x, st.y, st.z, radius, cx, cy);
    ctx.strokeStyle = st.color;
    ctx.lineWidth = 2.5;
    drawArrow(cx, cy, pt.x, pt.y, st.color);
    
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, 2*Math.PI); 
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();

    ctx.font = 'bold 13px Segoe UI';
    ctx.fillStyle = st.color;
    ctx.textAlign = 'left';
    ctx.fillText(st.name, pt.x+8, pt.y-8);
  });

  requestAnimationFrame(drawRender);
}

window.addEventListener('load', () => {
  canvas = document.getElementById('blochCanvas');
  ctx = canvas.getContext('2d');
  
  window.addEventListener('resize', resize);
  resize();

  canvas.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    camYaw -= (e.clientX - lastX) * 0.008;
    camPitch = Math.max(-1.5, Math.min(1.5, camPitch + (e.clientY - lastY) * 0.008));
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', () => isDragging = false);
  canvas.addEventListener('wheel', e => { 
    e.preventDefault();
    camZoom = Math.max(0.6, Math.min(1.8, camZoom - e.deltaY * 0.001)); 
  }, { passive: false });

  addState(0, 0, '|ψ0⟩');
  requestAnimationFrame(drawRender);
});
</script>
</body>
</html>
